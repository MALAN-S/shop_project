# Standalone Zero-Setup Embedded Database Profile
spring.application.name=xerox-shop-backend
server.port=8080

# Embedded H2 Database stored locally in ./data/shop_db
spring.datasource.url=jdbc:h2:file:./data/shop_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for standalone embedded mode
spring.flyway.enabled=false

# Multipart file upload limits (e.g. for CSV upload)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Jackson Date Format & Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

